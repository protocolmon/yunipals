# Intended www/alpha HTTPS server only. Requires nginx-http.conf.
location ^~ /api/anime-arena/ {
    limit_req zone=anime_arena_read burst=40 nodelay;
    limit_req zone=anime_arena_mutation burst=12 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:53912/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
