# nginx http block. Include once.
limit_req_zone $binary_remote_addr zone=anime_arena_read:10m rate=10r/s;
map $request_method $anime_arena_write_key { default ""; POST $binary_remote_addr; }
limit_req_zone $anime_arena_write_key zone=anime_arena_mutation:10m rate=10r/m;
map $http_origin $anime_assets_cors {
    default "";
    "https://www.yunipals.com" "https://www.yunipals.com";
    "https://alpha.yunipals.com" "https://alpha.yunipals.com";
}
map $uri $anime_assets_cache {
    default "public, max-age=300";
    "~\.[0-9a-f]{8,64}\.(webp|jpg|png|json)$" "public, max-age=31536000, immutable";
    ~^/engine/[0-9]+\.[0-9]+\.[0-9]+/ "public, max-age=31536000, immutable";
}
