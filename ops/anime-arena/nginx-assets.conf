# Install after DNS and TLS certificate provisioning; validate with nginx -t.
server {
    listen 80;
    listen [::]:80;
    server_name assets-anime.yunipals.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name assets-anime.yunipals.com;
    ssl_certificate /etc/letsencrypt/live/assets-anime.yunipals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assets-anime.yunipals.com/privkey.pem;
    root /var/www/assets-anime.yunipals.com;
    autoindex off;
    disable_symlinks on;
    add_header Access-Control-Allow-Origin $anime_assets_cors always;
    add_header Vary Origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $anime_assets_cache;
    location / { limit_except GET { deny all; } try_files $uri =404; }
    location ~ /\. { deny all; }
}
