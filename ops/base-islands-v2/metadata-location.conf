# Per-token metadata for the replacement Base collection.
location ~ "^/v2/base-islands/(?<base_revealed_island_id>[1-9][0-9]{0,3})$" {
    alias /srv/yunipals-islands/base-replacement-v2/public/metadata/$base_revealed_island_id.json;
    default_type application/json;
    limit_except GET { deny all; }
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=300";
}
location ~ "^/v2/base-islands/(?<base_reveal_proof>release|completion|snapshot|distribution|distribution\.manifest)\.json$" {
    alias /srv/yunipals-islands/base-replacement-v2/public/$base_reveal_proof.json;
    default_type application/json;
    limit_except GET { deny all; }
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=300";
}
location /v2/base-islands/ { return 404; }
