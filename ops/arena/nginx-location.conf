# Include only in the intended HTTPS virtual host after staging checks.
location ^~ /api/arena/ {
    limit_req zone=arena_read burst=20 nodelay;
    limit_req zone=arena_mutation burst=12 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:53911/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
    proxy_intercept_errors on;
    error_page 502 504 = @yunipals_arena_unavailable;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}

location @yunipals_arena_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"Arena is temporarily unavailable. Please try again shortly."}';
}
