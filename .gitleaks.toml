[[rules.allowlists]]
description = "Systemd NoNewPrivileges option adjacent to the environment-file path"
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)ops/base-islands(?:-v2)?/stage-api\.py$''']
regexes = ['''islands-api\.env','--property=NoNewPrivileges=true''']

[[rules.allowlists]]
description = "Public Base PROTO contract address in pack configuration and fixtures"
condition = "AND"
regexTarget = "secret"
paths = [
  '''(^|/)apps/yunipals-home-web/public/boosters/mainnet-(smoke|standard)-setup\.json$''',
  '''(^|/)apps/yunipals-home-web/src/lib/boosterSetup\.test\.ts$''',
  '''(^|/)apps/yunipals-home-web/scripts/test-booster-opening-ui\.mjs$''',
  '''(^|/)apps/yunipals-indexer/scripts/test-boosters-ponder\.mjs$''',
  '''(^|/)contracts/boosters/config/base-standard-v1\.draft\.json$''',
  '''(^|/)docs/boosters/mainnet-smoke/pack\.draft\.json$'''
]
regexes = ['''(?i)^0xe5a54a517cde8ed48a336b173044b1138aa2c1a3$''']

