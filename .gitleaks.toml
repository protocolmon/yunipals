title = "Yunipals secret scan"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public SHA-256 of the collector OpenAPI baseline"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)patches/collector-indexer/manifest\.json$''']
regexes = ['''^b4b7198c6c55878420c665ea88ac4fa668094d64536e696e6ff5b3f46bcaf979$''']

[[rules.allowlists]]
description = "Public Base USDC contract address; never an API credential"
regexTarget = "secret"
regexes = ['''(?i)^0x833589fcd6edb6e08f4c7c32d4f71b54bda02913$''']

[[rules.allowlists]]
description = "Verified public source SHA-256 values in island release manifests"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)docs/audit/base-islands(?:-v2)?/source-manifest\.json$''']
regexes = [
    "^05e6a7b50acc15c6db3a0e116f93e53ab4ce23a6cd0d4cb6717870de06b4fece$",
    "^33be4e245107f6cf991b350df84211965f3d98aff8b809c7c0acbdd501fc37a3$",
