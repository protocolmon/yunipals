[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
extra_output = ["storageLayout"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin/", "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-upgradeable/", "@chainlink/contracts/=lib/chainlink/", "forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./config" }, { access = "read", path = "./test/fixtures" }]

[profile.default.fuzz]
runs = 256

[profile.batch]
optimizer_runs = 1
out = "out-batch"
cache_path = "cache-batch"

[profile.permit]
optimizer_runs = 1
out = "out-permit"
cache_path = "cache-permit"

[fmt]
line_length = 110
