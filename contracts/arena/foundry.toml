[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
remappings = ["@openzeppelin/contracts/=lib/openzeppelin/", "@chainlink/contracts/=lib/chainlink/", "forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./config" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64

[fmt]
line_length = 110

