name: Portal regression tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check portal-related changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      portals: ${{ steps.filter.outputs.portals }}
    steps:
      # Use the PR file list without checking out or installing the workspace.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            portals:
              - '.github/workflows/portals.yml'
              - '.github/actions/setup-workspace/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'patches/**'
              - 'contracts/boosters/**'
              - 'scripts/portals/**'
              - 'scripts/evolution/**'
              - 'docs/boosters/artwork-runtime/**'
              - 'docs/adventures-serums-catalog.draft.json'
              # Shared contracts, indexing, API readers and worker dependencies.
              - 'apps/yunipals-indexer/**'
              - 'packages/**'
              # Shared browser code and build configuration affect these flows.
              - 'apps/yunipals-home-web/*'
              - 'apps/yunipals-home-web/scripts/**'
              - 'apps/yunipals-home-web/src/*'
              - 'apps/yunipals-home-web/src/components/**'
              - 'apps/yunipals-home-web/src/hooks/**'
              - 'apps/yunipals-home-web/src/lib/**'
              - 'apps/yunipals-home-web/src/providers/**'
              - 'apps/yunipals-home-web/src/data/**'
              - 'apps/yunipals-home-web/src/assets/**'
              - 'apps/yunipals-home-web/src/pages/portals/**'
              - 'apps/yunipals-home-web/src/pages/adventures/**'
              - 'apps/yunipals-home-web/src/pages/boosters/**'
              - 'apps/yunipals-home-web/public/**'

  portals:
    name: Portal contracts, indexing and browser flow
    needs: changes
    # Keep a completed check on unrelated PRs; main and manual runs always test.
    # If change detection fails, run the suite rather than silently skipping it.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.portals != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portal_test_owner
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: portal_test
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U portal_test_owner -d portal_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      FOUNDRY_PROFILE: permit
      PORTALS_TEST_DATABASE_URL: postgresql://portal_test_owner:local-test-only@127.0.0.1:55439/portal_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install pinned local test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/portal-tools" --ignore-scripts --no-audit --no-fund @foundry-rs/forge-linux-amd64@1.7.1 @foundry-rs/anvil-linux-amd64@1.7.1 playwright-core@1.65.0
          node "$RUNNER_TEMP/portal-tools/node_modules/playwright-core/cli.js" install --with-deps chromium
          python3 contracts/boosters/install-dependencies.py
          echo "$RUNNER_TEMP/portal-tools/node_modules/@foundry-rs/forge-linux-amd64/bin" >> "$GITHUB_PATH"
          echo "PORTALS_TEST_ANVIL=$RUNNER_TEMP/portal-tools/node_modules/@foundry-rs/anvil-linux-amd64/bin/anvil" >> "$GITHUB_ENV"
          echo "PORTALS_TEST_PLAYWRIGHT=$RUNNER_TEMP/portal-tools/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
      - name: Release contracts, storage, size and ABI
        run: |
          forge test --root contracts/boosters
          python3 scripts/portals/check-storage.py
          python3 scripts/portals/check-release.py
          python3 scripts/portals/export-abi.py --check
          python3 scripts/evolution/export-abi.py --out out-permit --check
      - name: Portal unit and recovery tests
        run: pnpm --filter @protopals/yunipals-indexer test:portals
      - name: Portal card picker and player guide
        run: |
          pnpm --filter @protopals/yunipals-home-web test:portals:picker
          pnpm --filter @protopals/yunipals-home-web test:portals:picker:ui --playwright "$PORTALS_TEST_PLAYWRIGHT"
      - name: PostgreSQL roles, concurrent recovery and restore
        run: pnpm --filter @protopals/yunipals-indexer test:portals:postgres
      - name: Shared portal handlers, views, reorg and worker recovery
        env:
          PGPASSWORD: local-test-only
          PORTAL_SHARED_TEST_DATABASE_URL: postgresql://portal_test_owner:local-test-only@127.0.0.1:55439/yunipals_portal_shared_test
        run: |
          createdb -h 127.0.0.1 -p 55439 -U portal_test_owner yunipals_portal_shared_test
          pnpm --filter @protopals/yunipals-indexer test:portals:shared
      - name: Browser to API to ledger to contracts, 111-entry challenge
        run: pnpm --filter @protopals/yunipals-indexer test:portals:local
      - name: Adventures, serum generation and same-collection fusion
        run: |
          pnpm --filter @protopals/yunipals-indexer test:evolution
          pnpm --filter @protopals/yunipals-indexer test:evolution:ponder
          pnpm --filter @protopals/yunipals-indexer test:evolution:local
          EVOLUTION_TEST_SINGULARITY=1 pnpm --filter @protopals/yunipals-indexer test:evolution:local
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portal-browser-evidence
          path: |
            /tmp/yunipals-portals-*.png
            /tmp/yunipals-portal-*.png
            /tmp/yunipals-evolution-*.png
          if-no-files-found: ignore
          retention-days: 14
